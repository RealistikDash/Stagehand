[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/realistik/wpe-gnome"
authors = ["realistik"]

[workspace.dependencies]
wpe-gnome-core = { path = "crates/wpe-gnome-core" }
wpe-gnome-ipc = { path = "crates/wpe-gnome-ipc" }

async-channel = "2"
clap = { version = "4", features = ["derive"] }
futures-lite = "2"
gdk-pixbuf = "0.22"
gio = "0.22"
glib = "0.22"
gstreamer = { version = "0.25", features = ["v1_28"] }
gstreamer-video = { version = "0.25", features = ["v1_28"] }
gtk4 = { version = "0.11", features = ["v4_22"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libadwaita = { version = "0.9", features = ["v1_9"] }
notify = "8"
rustix = { version = "1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
thiserror = "2"
tracing = "0.1"
tracing-journald = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
webkit6 = { version = "0.6", features = ["v2_52"] }
zbus = { version = "5", default-features = false, features = ["async-io"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
print_stdout = "warn"
dbg_macro = "warn"
# Pedantic lints that conflict with the project's style guide (§7.13: less documentation is the
# default; §7.7: repository names repeat their module name by convention).
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
# Trait methods are async by contract; clippy flags implementations that happen not to await.
unused_async = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
